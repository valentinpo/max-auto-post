<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAX Авто-постинг — Панель</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --border: #30363d;
      --text: #e6edf3; --dim: #8b949e; --green: #00ff41; --blue: #06b6d4;
      --purple: #8b5cf6; --red: #f85149;
      --mono: 'JetBrains Mono', Consolas, monospace; --sans: Inter, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 60px; }
    h1 { font-family: var(--mono); font-size: 1.5rem; display: flex; align-items: center; gap: 10px; }
    h1 .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--red); display: inline-block; }
    h1 .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-line { color: var(--dim); font-size: 0.85rem; margin: 4px 0 20px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
    .card h2 { margin: 0 0 12px; font-size: 1.05rem; font-family: var(--mono); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    button, .btn {
      background: transparent; color: var(--text); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-family: inherit;
      transition: all .2s;
    }
    button:hover, .btn:hover { border-color: var(--blue); color: var(--blue); }
    button.primary { background: linear-gradient(135deg, var(--green), var(--blue)); color: #000; font-weight: 700; border: none; }
    button.primary:hover { filter: brightness(1.1); color: #000; }
    button.danger { border-color: var(--red); color: var(--red); }
    button.danger:hover { background: var(--red); color: #fff; }
    input, select, textarea {
      background: #0d1117; color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; font-size: 0.85rem; font-family: inherit; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue); }
    label { font-size: 0.78rem; color: var(--dim); display: block; margin-bottom: 4px; }
    .field { margin-bottom: 12px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .post-item, .chan-item { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .post-item .info { flex: 1; min-width: 0; }
    .post-item .time { color: var(--green); font-family: var(--mono); font-weight: 700; }
    .post-item .text { color: var(--dim); font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .post-item .chans { color: var(--purple); font-size: 0.75rem; }
    .log-box { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; height: 260px; overflow-y: auto; padding: 10px 12px; font-family: var(--mono); font-size: 0.78rem; }
    .log-box .entry { margin: 2px 0; }
    .log-box .t { color: var(--dim); margin-right: 8px; }
    .img-list { display: flex; flex-wrap: wrap; gap: 10px; }
    .img-item { border: 1px solid var(--border); border-radius: 6px; padding: 6px; text-align: center; width: 140px; }
    .img-item img { max-width: 120px; max-height: 80px; border-radius: 4px; display: block; margin: 0 auto 6px; }
    .img-item .nm { font-size: 0.7rem; color: var(--dim); word-break: break-all; }
    .mut { color: var(--dim); }
    .hidden { display: none !important; }
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; width: min(480px, 92vw); max-height: 88vh; overflow-y: auto; }
    .modal h3 { margin: 0 0 16px; font-family: var(--mono); }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
    @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } .field-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span class="dot" id="statusDot"></span> MAX Авто-постинг</h1>
    <div class="status-line" id="statusLine">Загрузка…</div>

    <div class="card">
      <h2>Управление</h2>
      <div class="row">
        <button id="btnStart" class="primary">▶ Запустить постинг</button>
        <button id="btnStop" class="danger">⏹ Остановить</button>
        <span class="mut" id="tokenStatus"></span>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>Посты</h2>
        <div id="postsList"></div>
        <div class="row"><button id="btnAddPost">+ Добавить пост</button></div>
      </div>

      <div class="card">
        <h2>Каналы</h2>
        <div id="channelsList"></div>
        <div class="row">
          <button id="btnAddChannel">+ Добавить канал</button>
          <button id="btnDiscover">🛰 Получить chat_id</button>
        </div>
        <div class="mut" id="discoverResult" style="margin-top:8px; font-size:0.8rem;"></div>
      </div>
    </div>

    <div class="card">
      <h2>Лог</h2>
      <div class="log-box" id="logBox"></div>
    </div>

    <div class="card">
      <h2>Картинки (<span id="imgCount">0</span>)</h2>
      <div class="row" style="margin-bottom:12px">
        <input type="file" id="fileInput" accept="image/*" style="flex:1">
        <button id="btnUpload" class="primary">Загрузить</button>
      </div>
      <div class="img-list" id="imgList"></div>
    </div>
  </div>

  <div class="modal-bg hidden" id="modalBg">
    <div class="modal" id="modalContent"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
